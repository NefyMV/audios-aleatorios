
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769aa">
  <title>Escucha un mensaje</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e4f3ff, #f8fbff);
      color: #18324b;
    }

    .tarjeta {
      width: 100%;
      max-width: 430px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 28px rgba(0, 45, 90, 0.12);
    }

    .icono {
      font-size: 58px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      line-height: 1.6;
      color: #52677a;
    }

    audio {
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #escuchar {
      color: white;
      background: #1769aa;
    }

    #otro {
      color: #1769aa;
      background: #e8f3fc;
    }

    #estado {
      min-height: 48px;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="tarjeta">
    <div class="icono">🎧</div>
    <h1>¡Spelling Bee 3ro!</h1>
    <p>Escucha la palabra y deletrea.</p>

    <audio id="reproductor" controls preload="auto"></audio>

    <button id="escuchar" type="button">
      ▶ Escuchar palabra
    </button>

    <button id="otro" type="button">
      🔀 Escuchar otra palabra
    </button>

    <p id="estado" aria-live="polite">
      Preparando tu nueva palabra...
    </p>
  </main>

  <script>
    const totalAudios = 42;
    const reproductor = document.getElementById("reproductor");
    const botonEscuchar = document.getElementById("escuchar");
    const botonOtro = document.getElementById("otro");
    const estado = document.getElementById("estado");

    let audioActual = 0;

    function elegirAudio() {
      let numero;

      do {
        numero = Math.floor(Math.random() * totalAudios) + 1;
      } while (numero === audioActual && totalAudios > 1);

      audioActual = numero;

      const nombre = "audio" + String(numero).padStart(2, "0") + ".mp3";

      reproductor.src = "./audios/" + nombre;
      reproductor.load();

      estado.textContent = "Nueva palabra. ¡Pon atención!";

      // Intentar reproducir automáticamente.
      const intento = reproductor.play();

      if (intento !== undefined) {
        intento.then(() => {
          estado.textContent = "Reproduciendo tu palabra...";
        }).catch(() => {
          estado.textContent =
            "Toca «Otra palabra aleatoria» para reproducir tu mensaje.";
        });
      }
    }

    botonEscuchar.addEventListener("click", () => {
      reproductor.play().then(() => {
        estado.textContent = "Reproduciendo tu palabra...";
      }).catch(() => {
        estado.textContent =
          "No se pudo reproducir. Revisa tu conexión e inténtalo otra vez.";
      });
    });

    botonOtro.addEventListener("click", elegirAudio);

    reproductor.addEventListener("ended", () => {
      estado.textContent =
        "¡Palabra lista! Puedes escuchar otra si lo deseas.";
    });

    reproductor.addEventListener("error", () => {
      estado.textContent =
        "No se encontró el audio. Revisa que el archivo exista y su nombre sea correcto.";
    });

    elegirAudio();
  </script>
</body>
</html>
